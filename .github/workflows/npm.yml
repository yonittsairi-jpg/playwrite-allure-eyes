name: NodeJS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # REMOVED the incorrect local file path that was here

      - name: Install Dependencies & Install Playwright
        run: |
          npm install
          npx playwright install --with-deps

      - name: Build and Test
        env:
          # Using the correct secret syntax
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          # Setting a consistent Batch ID for PRs vs Pushes
          APPLITOOLS_BATCH_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run test-allure
